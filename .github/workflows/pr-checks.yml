# Fast feedback on every pull request / push (Jenkins remains the main CI/CD server).
# Shows as a status check on each GitHub pull request.
name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (flake8)
        run: flake8
      - name: Unit tests (pytest + coverage)
        run: python -m pytest --cov=aceest --cov-report=term-missing --cov-fail-under=90

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Run tests inside the container (test stage)
        run: |
          docker build --target test -t aceest-fitness:test .
          docker run --rm aceest-fitness:test
      - name: Build runtime image and smoke test
        run: |
          docker build --target runtime -t aceest-fitness:ci .
          docker run -d --name smoke -p 5000:5000 aceest-fitness:ci
          for i in $(seq 1 15); do curl -fs http://localhost:5000/health && exit 0; sleep 2; done
          docker logs smoke; exit 1
