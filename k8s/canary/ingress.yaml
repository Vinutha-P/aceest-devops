---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-canary-stable
  namespace: aceest
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /canary
            pathType: Prefix
            backend:
              service:
                name: aceest-canary-stable
                port:
                  number: 80
---
# Canary ingress: 20% of /canary requests go to the new version.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-canary-new
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "20"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /canary
            pathType: Prefix
            backend:
              service:
                name: aceest-canary-new
                port:
                  number: 80
