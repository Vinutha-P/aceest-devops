---
# Variant A (control).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-ab-a
  namespace: aceest
  labels:
    app: aceest
    strategy: ab
    variant: a
  annotations:
    kubernetes.io/change-cause: "initial deploy your-dockerhub-username/aceest-fitness:3.1.2"
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: aceest
      strategy: ab
      variant: a
  template:
    metadata:
      labels:
        app: aceest
        strategy: ab
        variant: a
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: your-dockerhub-username/aceest-fitness:3.1.2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: DEPLOYMENT_TRACK
              value: "variant-a"
            - name: URL_PREFIX
              value: "/ab"
            - name: ACEEST_DB
              value: /data/aceest_fitness.db
            - name: GUNICORN_WORKERS
              value: "2"
          envFrom:
            - secretRef:
                name: aceest-secrets   # ACEEST_SECRET_KEY, ACEEST_ADMIN_PASSWORD
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]   # let the ingress stop sending traffic first
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
