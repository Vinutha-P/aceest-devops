---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-a
  namespace: aceest
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /ab
            pathType: Prefix
            backend:
              service:
                name: aceest-ab-a
                port:
                  number: 80
---
# A/B routing: header 'X-Variant: B' or cookie 'ab_variant=always' -> variant B; everyone else -> variant A.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-b
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Variant"
    nginx.ingress.kubernetes.io/canary-by-header-value: "B"
    nginx.ingress.kubernetes.io/canary-by-cookie: "ab_variant"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /ab
            pathType: Prefix
            backend:
              service:
                name: aceest-ab-b
                port:
                  number: 80
