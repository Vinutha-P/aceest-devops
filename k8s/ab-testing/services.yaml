---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-a
  namespace: aceest
  labels:
    app: aceest
spec:
  type: ClusterIP
  selector:
    app: aceest
    strategy: ab
    variant: a
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-b
  namespace: aceest
  labels:
    app: aceest
spec:
  type: ClusterIP
  selector:
    app: aceest
    strategy: ab
    variant: b
  ports:
    - name: http
      port: 80
      targetPort: http
