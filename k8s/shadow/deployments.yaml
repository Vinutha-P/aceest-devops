              value: "shadow"
            - name: URL_PREFIX
              value: "/shadow"
            - name: ACEEST_DB
              value: /data/aceest_fitness.db
            - name: GUNICORN_WORKERS
              value: "2"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
