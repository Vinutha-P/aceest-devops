---
# Primary - serves real users.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-primary
  namespace: aceest
  labels:
    app: aceest
    strategy: shadow
    track: primary
  annotations:
    kubernetes.io/change-cause: "initial deploy your-dockerhub-username/aceest-fitness:2.2.4"
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: aceest
      strategy: shadow
      track: primary
  template:
    metadata:
      labels:
        app: aceest
        strategy: shadow
        track: primary
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: your-dockerhub-username/aceest-fitness:2.2.4
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: DEPLOYMENT_TRACK
              value: "primary"
            - name: URL_PREFIX
              value: "/shadow"
            - name: ACEEST_DB
              value: /data/aceest_fitness.db
            - name: GUNICORN_WORKERS
              value: "2"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]   # let the ingress stop sending traffic first
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# Shadow - receives a mirrored copy of every request; responses are discarded.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-new
  namespace: aceest
  labels:
    app: aceest
    strategy: shadow
    track: shadow
