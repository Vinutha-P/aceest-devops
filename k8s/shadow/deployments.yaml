spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: aceest
      strategy: shadow
      track: shadow
  template:
    metadata:
      labels:
        app: aceest
        strategy: shadow
        track: shadow
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
