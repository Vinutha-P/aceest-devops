---
# BLUE environment - currently live (old version).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest
  labels:
    app: aceest
    strategy: blue-green
    color: blue
  annotations:
    kubernetes.io/change-cause: "initial deploy your-dockerhub-username/aceest-fitness:3.0.1"
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: aceest
      strategy: blue-green
      color: blue
  template:
    metadata:
      labels:
        app: aceest
        strategy: blue-green
        color: blue
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: your-dockerhub-username/aceest-fitness:3.0.1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: DEPLOYMENT_TRACK
              value: "blue"
            - name: URL_PREFIX
              value: "/bluegreen"
            - name: ACEEST_DB
              value: /data/aceest_fitness.db
            - name: GUNICORN_WORKERS
              value: "2"
          envFrom:
            - secretRef:
                name: aceest-secrets   # ACEEST_SECRET_KEY, ACEEST_ADMIN_PASSWORD
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]   # let the ingress stop sending traffic first
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
