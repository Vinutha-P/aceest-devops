---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-bluegreen
  namespace: aceest
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /bluegreen
            pathType: Prefix
            backend:
              service:
                name: aceest-bluegreen
                port:
                  number: 80
