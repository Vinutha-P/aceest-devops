---
# /rolling/... and the site root / both go to the rolling deployment (production).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-rolling
  namespace: aceest
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /rolling
            pathType: Prefix
            backend:
              service:
                name: aceest-rolling
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-rolling
                port:
                  number: 80
